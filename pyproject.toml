[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "doogle"
version = "1.2.0rc1"
description = "Do the Google Agent: route a plain-English goal to safe, verifiable blueprints for Google Cloud, Firebase, Workspace and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Doogle contributors" }]
keywords = ["google-cloud", "cloud-run", "gemini", "adk", "apps-script", "workspace", "cli", "agent", "blueprints"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "build>=1.0", "hypothesis>=6.100", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/rjohnn1/Doogle"
Documentation = "https://github.com/rjohnn1/Doogle#readme"
Issues = "https://github.com/rjohnn1/Doogle/issues"
Changelog = "https://github.com/rjohnn1/Doogle/blob/main/CHANGELOG.md"

[project.scripts]
doogle = "doogle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doogle"]

# Ship the blueprints inside the wheel as package data (doogle/blueprints).
[tool.hatch.build.targets.wheel.force-include]
"blueprints" = "doogle/blueprints"

[tool.hatch.build.targets.sdist]
include = ["src", "blueprints", "tests", "docs", "scripts", "README.md", "CONTRIBUTING.md", "OPERATING_GUIDE.md",
           "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mutmut]
# Mutation testing of the safety-critical modules: `pip install mutmut && mutmut run`.
source_paths = ["src/doogle"]
do_not_mutate = ["src/doogle/cli.py", "src/doogle/docs.py", "src/doogle/__init__.py", "src/doogle/__main__.py"]
also_copy = ["blueprints", "docs", ".github", "demo", "scripts", "README.md", "CONTRIBUTING.md",
             "OPERATING_GUIDE.md", "CHANGELOG.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "SUPPORT.md",
             "GOVERNANCE.md", "LICENSE", ".gitignore"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "--deselect", "tests/test_hardening.py::test_real_sigint_mid_step_via_cli",
                       "--deselect", "tests/test_hardening.py::test_concurrent_writers_never_lose_runs"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C90", "PLE", "PLW", "PERF", "DTZ"]
ignore = ["S101", "S603", "S404", "RUF001", "RUF002", "RUF003", "PERF401", "DTZ011"]  # DTZ011: freshness uses the local calendar day on purpose

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLW", "PERF", "DTZ", "E731", "B023"]
"scripts/*" = ["S"]

[tool.ruff.lint.mccabe]
max-complexity = 45  # validator/doctor are flat checklists; see docs/QUALITY_REPORT.md

[tool.mypy]
python_version = "3.10"
files = ["src/doogle"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
