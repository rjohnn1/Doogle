[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "doogle"
version = "1.1.0"
description = "Do the Google Agent: route a plain-English goal to safe, verifiable blueprints for Google Cloud, Firebase, Workspace and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Doogle contributors" }]
keywords = ["google-cloud", "cloud-run", "gemini", "adk", "apps-script", "workspace", "cli", "agent", "blueprints"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "build>=1.0"]

# TODO(maintainer): replace OWNER/REPO before publishing to PyPI.
[project.urls]
Homepage = "https://github.com/OWNER/REPO"
Documentation = "https://github.com/OWNER/REPO#readme"
Issues = "https://github.com/OWNER/REPO/issues"
Changelog = "https://github.com/OWNER/REPO/blob/main/CHANGELOG.md"

[project.scripts]
doogle = "doogle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doogle"]

# Ship the blueprints inside the wheel as package data (doogle/blueprints).
[tool.hatch.build.targets.wheel.force-include]
"blueprints" = "doogle/blueprints"

[tool.hatch.build.targets.sdist]
include = ["src", "blueprints", "tests", "docs", "scripts", "README.md", "CONTRIBUTING.md", "OPERATING_GUIDE.md",
           "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
