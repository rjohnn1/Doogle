name: New blueprint proposal
description: Propose a new builder workflow for Doogle to cover.
title: "[blueprint] <proposed-id>: <one-line value>"
labels: ["blueprint-request"]
body:
  - type: markdown
    attributes:
      value: |
        Good blueprints are small, common and reversible. See CONTRIBUTING.md for the schema and
        "your first blueprint in 15 minutes".
  - type: input
    id: id
    attributes:
      label: Proposed id (kebab-case)
      placeholder: firebase-functions-cron
    validations:
      required: true
  - type: textarea
    id: when-to-use
    attributes:
      label: When to use it
      description: Concrete situations where this is the right stack.
    validations:
      required: true
  - type: textarea
    id: when-not
    attributes:
      label: When NOT to use it
      description: Name at least one simpler or cheaper alternative builders should consider first.
    validations:
      required: true
  - type: textarea
    id: services
    attributes:
      label: Google services and CLIs involved
    validations:
      required: true
  - type: textarea
    id: teardown
    attributes:
      label: How is it torn down?
      description: Every blueprint must remove what it creates, or say what must be removed by hand.
    validations:
      required: true
  - type: checkboxes
    id: offer
    attributes:
      label: Contribution
      options:
        - label: I am willing to write this blueprint (with help).
        - label: I can test it against a throwaway project (for `live` verification).
