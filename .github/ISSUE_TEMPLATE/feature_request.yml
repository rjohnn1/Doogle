name: Feature request
description: Suggest an improvement to the Doogle CLI, engine, docs or safety model.
title: "[feature] <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Doogle do? How does it keep the dry-run, approval and no-shell guarantees?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
