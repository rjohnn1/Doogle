name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit, property and eval tests (with coverage)
        run: pytest -q --cov=doogle --cov-branch --cov-report=term-missing
      - name: Blueprint schema & integrity
        run: doogle validate
      - name: Generated docs are up to date
        run: doogle docs --check
      - name: CLI smoke checks (no cloud tools needed)
        run: |
          doogle --help
          doogle list --json
          doogle explain solo-serverless-api --json
          doogle plan solo-serverless-api --var project_id=ci-demo-project --json
          doogle ask "I want a cheap API for my side project" --json
          doogle doctor --json
          doogle list --stale --json
          doogle share solo-serverless-api --json

  # Windows is NOT a supported platform yet (state locking falls back to msvcrt and
  # POSIX-only tests are skipped). This job reports, it does not gate.
  windows-experimental:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Validate
        run: doogle validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy types-PyYAML bandit pip-audit
      - name: Ruff
        run: ruff check src scripts tests
      - name: Mypy (strict)
        run: mypy
      - name: Bandit
        run: bandit -q -r src scripts
      - name: Dependency audit (project dependencies)
        run: pip-audit .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Installed wheel finds bundled blueprints from another directory
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/doogle validate
          /tmp/wheel-env/bin/doogle list --json
      - name: Installed sdist works too
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/sdist-env/bin/doogle validate
          /tmp/sdist-env/bin/doogle plan solo-serverless-api --var project_id=ci-demo-project --json
